name: Game of life testing 

on: push 

jobs: 
  game-of-life-test: 
    runs-on: ubuntu-latest 
    strategy: 
      matrix: 
        java: [ '17', '21', '25' ]

    steps: 
      - name: Checkout repo 
        uses: actions/checkout@v4 

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5.1 
        with: 
          maven-version: 3.8.2 

      # Fragmento modificado con la variable de contexto
      - name: Set up JDK
        uses: actions/setup-java@v4 
        with: 
          distribution: 'temurin' 
          java-version: ${{ matrix.java }}

      - name: Maven test 
        run: mvn test

